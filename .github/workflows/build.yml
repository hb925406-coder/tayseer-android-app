name: Build Tayseer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Consistent Keystore
      run: |
        keytool -genkeypair -v -keystore tayseer-release.jks -alias tayseer -keyalg RSA -keysize 2048 -validity 10000 -storepass tayseer123 -keypass tayseer123 -dname "CN=TayseerApp, OU=Dev, O=Tayseer, L=City, S=State, C=YE"

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Sign APK with Consistent Key
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS_DIR/apksigner sign --ks tayseer-release.jks --ks-pass pass:tayseer123 --ks-key-alias tayseer --key-pass pass:tayseer123 --out app/build/outputs/apk/debug/tayseer-signed.apk "$APK_PATH"

    - name: Upload Tayseer APK
      uses: actions/upload-artifact@v4
      with:
        name: tayseer-app-signed
        path: app/build/outputs/apk/debug/tayseer-signed.apk
