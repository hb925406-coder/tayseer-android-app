name: Build Tayseer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK using Global Gradle
      run: gradle assembleRelease || gradle assembleDebug --stacktrace

    - name: Sign APK with Fixed Tayseer Key
      run: |
        APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
        keytool -genkeypair -v \
          -keystore permanent-tayseer.jks \
          -alias tayseerkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 20000 \
          -storepass tayseerApp2026 \
          -keypass tayseerApp2026 \
          -dname "CN=Tayseer, OU=App, O=TayseerOrg, L=Tarim, ST=Hadhramaut, C=YE"
        
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 "$APK_FILE" aligned-tayseer.apk
        $BUILD_TOOLS/apksigner sign \
          --ks permanent-tayseer.jks \
          --ks-pass pass:tayseerApp2026 \
          --ks-key-alias tayseerkey \
          --key-pass pass:tayseerApp2026 \
          --out tayseer-release-fixed.apk aligned-tayseer.apk

    - name: Upload Tayseer Fixed APK
      uses: actions/upload-artifact@v4
      with:
        name: tayseer-apk-update
        path: tayseer-release-fixed.apk
